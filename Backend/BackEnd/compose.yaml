services:
  backend:
    image: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
     - "5035:8080"
    environment:
     - ASPNETCORE_URLS=http://+:8080
     - ASPNETCORE_ENVIRONMENT=Development
     - Jwt__Secret=QUcm7W1aH,iCYFF&>mR^u92SmvJj>^2,
     - ConnectionStrings__DefaultConnection=Data Source=/app/data/BackEnd.db
    volumes:
      # Folderul local "data" din Fedora se leagă direct la "/app/data" din container
      - ./data:/app/data